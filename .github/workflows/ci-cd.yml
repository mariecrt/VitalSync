name: VitalSync CI/CD

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:
  lint-and-tests:
    name: Lint and Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint

      - name: Run unit tests
        run: npm test

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-tests
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tags
        run: |
          echo "BACKEND_IMAGE=ghcr.io/${{ github.repository_owner }}/vitalsync-backend:${{ github.sha }}" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=ghcr.io/${{ github.repository_owner }}/vitalsync-frontend:${{ github.sha }}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}

  deploy-staging:
    name: Deploy Staging and Health Check
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env for staging deployment
        run: |
          cat <<EOF > .env
          POSTGRES_DB=vitalsync
          POSTGRES_USER=vitalsync_user
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DB_HOST=database
          DB_PORT=5432
          PORT=3000
          EOF

      - name: Start staging stack with Docker Compose
        run: docker compose up -d --build

      - name: Health check backend endpoint
        run: |
          for i in {1..15}; do
            if curl -fsS http://localhost:3000/health > /dev/null; then
              echo "Backend health check passed"
              exit 0
            fi
            echo "Health check attempt $i/15 failed, retrying..."
            sleep 4
          done
          echo "Backend health check failed"
          exit 1

      - name: Show running containers
        if: always()
        run: docker ps -a

      - name: Teardown staging stack
        if: always()
        run: docker compose down -v
